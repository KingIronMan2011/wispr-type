[package]
name = "veskri"
version = "1.4.1"
description = "Fast, private desktop dictation powered by Groq"
authors = ["Veskri"]
license = "MIT"
repository = "https://github.com/veskri/veskri"
homepage = "https://github.com/veskri/veskri"
readme = "../README.md"
keywords = ["dictation", "voice-to-text", "speech-to-text", "whisper", "tauri"]
categories = ["accessibility", "gui", "multimedia::audio"]
edition = "2021"

[lib]
name = "veskri_lib"
crate-type = ["rlib", "cdylib", "staticlib"]

[features]
default = []
local-whisper-cuda = ["whisper-rs/cuda"]
local-whisper-rocm = ["whisper-rs/hipblas"]
local-whisper-vulkan = ["whisper-rs/vulkan"]
local-whisper-metal = ["whisper-rs/metal"]

[[bin]]
name = "veskri"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.5.1", features = [] }

[dependencies]
tauri = { version = "2.11.1", features = ["tray-icon"] }
tauri-plugin-autostart = "2.5.1"
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-opener = "2.5.4"
tauri-plugin-process = "2.3.1"
tauri-plugin-updater = "2.10.1"
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "multipart", "rustls-tls", "stream"] }
fs2 = "0.4"
sha2 = "0.10"
sysinfo = "0.37"
keyring = "4.1.5"
enigo = "0.6.1"
chrono = { version = "0.4", features = ["serde"] }
cpal = "0.15.3"
hound = "3.5.1"
opus-rs = "0.1.23"
rusqlite = { version = "0.37.0", features = ["bundled"] }
tauri-plugin-log = "2"
tauri-plugin-single-instance = "2"
log = "0.4"
whisper-rs = "=0.16.0"
