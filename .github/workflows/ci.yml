name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-lint:
    name: GitHub Actions workflow lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          cache: false
      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Lint GitHub Actions workflows
        run: actionlint -color

  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libclang-dev \
            file \
            libasound2-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libvulkan-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            rpm \
            glslc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
          key: ubuntu-quality
      - run: pnpm install --frozen-lockfile
      - run: pnpm metadata:check
      - run: pnpm format:check
      - run: pnpm types
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm test:rust
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e

  local-whisper-backends:
    name: Local Whisper (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Vulkan
            runner: ubuntu-latest
            feature: local-whisper-vulkan
            cache_key: ubuntu-vulkan
            backend: vulkan
          - name: CUDA
            runner: windows-latest
            feature: local-whisper-cuda
            cache_key: windows-cuda
            backend: cuda
          - name: Metal
            runner: macos-26
            feature: local-whisper-metal
            cache_key: macos-metal
            backend: metal
          - name: Intel SYCL (Linux)
            runner: ubuntu-latest
            feature: local-whisper-intel-sycl
            cache_key: linux-intel-sycl
            backend: intel-sycl-linux
          - name: Intel SYCL (Windows)
            runner: windows-latest
            feature: local-whisper-intel-sycl
            cache_key: windows-intel-sycl
            backend: intel-sycl-windows
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux Vulkan build dependencies
        if: matrix.backend == 'vulkan'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            file \
            libasound2-dev \
            libappindicator3-dev \
            libclang-dev \
            librsvg2-dev \
            libssl-dev \
            libvulkan-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            rpm \
            glslc
      - name: Install Windows CUDA build dependencies
        if: matrix.backend == 'cuda'
        shell: pwsh
        run: |
          winget install --id Nvidia.CUDA --exact --silent --accept-package-agreements --accept-source-agreements --source winget
          winget install --id LLVM.LLVM --exact --silent --accept-package-agreements --accept-source-agreements --source winget
          $cuda = Get-ChildItem 'C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA' -Directory | Sort-Object Name -Descending | Select-Object -First 1
          if (-not $cuda) { throw 'The CUDA Toolkit installation was not found.' }
          & "$($cuda.FullName)\bin\nvcc.exe" -V
          "CUDA_PATH=$($cuda.FullName)" >> $env:GITHUB_ENV
          "CudaToolkitDir=$($cuda.FullName)\" >> $env:GITHUB_ENV
          "CUDAToolkit_ROOT=$($cuda.FullName)" >> $env:GITHUB_ENV
          "CUDACXX=$($cuda.FullName)\bin\nvcc.exe" >> $env:GITHUB_ENV
          "$($cuda.FullName)\bin" >> $env:GITHUB_PATH
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV
          'CARGO_TARGET_DIR=D:\veskri-ci-cuda-target' >> $env:GITHUB_ENV
      - name: Install Windows Intel oneAPI build dependencies
        if: matrix.backend == 'intel-sycl-windows'
        shell: pwsh
        run: |
          winget install --id Intel.OneAPI.Toolkit --exact --silent --accept-package-agreements --accept-source-agreements --source winget
          winget install --id LLVM.LLVM --exact --silent --accept-package-agreements --accept-source-agreements --source winget
          $oneapi = 'C:\Program Files (x86)\Intel\oneAPI'
          $setvars = Join-Path $oneapi 'setvars.bat'
          if (-not (Test-Path -LiteralPath $setvars)) { throw 'The Intel oneAPI Toolkit installation was not found.' }
          $environment = cmd /c "call `"$setvars`" intel64 >nul && set"
          foreach ($entry in $environment) {
            if ($entry -match '^PATH=(.*)$') {
              $Matches[1] -split ';' | Where-Object { $_ } | Add-Content -Path $env:GITHUB_PATH
            } elseif ($entry -match '^(ONEAPI_ROOT|CMPLR_ROOT|DPCPP_ROOT|MKLROOT|DNNLROOT|INCLUDE|LIB|LIBPATH)=(.*)$') {
              $entry | Add-Content -Path $env:GITHUB_ENV
            }
          }
          'CARGO_TARGET_DIR=D:\veskri-ci-intel-target' >> $env:GITHUB_ENV
      - name: Configure Windows C/C++ headers for Local Whisper bindgen
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $clang = 'C:\Program Files\LLVM\bin\clang.exe'
          $resource = & $clang -print-resource-dir
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $msvc = Get-ChildItem "$vs\VC\Tools\MSVC" -Directory | Sort-Object Name -Descending | Select-Object -First 1
          $sdk = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\Include' -Directory | Sort-Object Name -Descending | Select-Object -First 1
          if (-not $resource -or -not $msvc -or -not $sdk) { throw 'Required Windows C/C++ headers were not found.' }
          $includes = @(
            "-isystem$resource\include",
            "-isystem$($msvc.FullName)\include",
            "-isystem$($sdk.FullName)\ucrt",
            "-isystem$($sdk.FullName)\shared",
            "-isystem$($sdk.FullName)\um"
          ) -join ' '
          "BINDGEN_EXTRA_CLANG_ARGS_x86_64_pc_windows_msvc=$includes" >> $env:GITHUB_ENV
      - name: Install Linux Intel oneAPI build dependencies
        if: matrix.backend == 'intel-sycl-linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            file \
            gpg \
            libasound2-dev \
            libappindicator3-dev \
            libclang-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            rpm \
            wget
          wget -qO- https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB \
            | gpg --dearmor | sudo tee /usr/share/keyrings/oneapi-archive-keyring.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/oneapi-archive-keyring.gpg] https://apt.repos.intel.com/oneapi all main" \
            | sudo tee /etc/apt/sources.list.d/oneAPI.list
          sudo apt-get update
          sudo apt-get install -y \
            intel-oneapi-compiler-dpcpp-cpp-and-cpp-classic \
            intel-oneapi-dnnl-devel \
            intel-oneapi-mkl-devel
          source /opt/intel/oneapi/setvars.sh --force > /dev/null
          for variable in ONEAPI_ROOT CMPLR_ROOT DPCPP_ROOT MKLROOT DNNLROOT CPATH LIBRARY_PATH LD_LIBRARY_PATH; do
            value="${!variable:-}"
            if [ -n "$value" ]; then
              echo "$variable=$value" >> "$GITHUB_ENV"
            fi
          done
          tr ':' '\n' <<< "$PATH" >> "$GITHUB_PATH"
      - name: Install macOS Metal build dependencies
        if: runner.os == 'macOS'
        run: |
          brew install llvm
          echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> "$GITHUB_ENV"
          echo "MACOSX_DEPLOYMENT_TARGET=26.0" >> "$GITHUB_ENV"
          echo "CMAKE_OSX_DEPLOYMENT_TARGET=26.0" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
          key: ${{ matrix.cache_key }}
      - name: Compile the optional Local Whisper backend
        run: cargo check --manifest-path src-tauri/Cargo.toml --features ${{ matrix.feature }}
