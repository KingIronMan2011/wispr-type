name: Release Veskri

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing version tag to publish (for example, v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    steps:
      - name: Create the draft release once
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; uploading missing artifacts."
            exit 0
          fi

          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Veskri $RELEASE_TAG" \
            --generate-notes \
            --draft

  release:
    needs: prepare-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            cache_key: windows-x64
            args: ""
          - runner: ubuntu-latest
            cache_key: linux-x64
            args: "--bundles appimage,deb,rpm"
          - runner: macos-26-intel
            cache_key: macos-intel
            args: "--bundles app,dmg --no-sign"
          - runner: macos-26
            cache_key: macos-arm64
            args: "--bundles app,dmg --no-sign"
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            file \
            gnupg \
            libasound2-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            rpm
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
          key: ${{ matrix.cache_key }}
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: ${{ inputs.release_tag || github.ref_name }}
          releaseName: "Veskri ${{ inputs.release_tag || github.ref_name }}"
          releaseBody: "Windows and Linux installers, plus unsigned macOS builds for Apple Silicon and Intel. All in-app updater packages are signed."
          releaseDraft: true
          prerelease: false
          generateReleaseNotes: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}
      - name: Import Linux release signing key
        if: runner.os == 'Linux'
        env:
          LINUX_GPG_PRIVATE_KEY: ${{ secrets.LINUX_GPG_PRIVATE_KEY }}
          LINUX_GPG_FINGERPRINT: BE00817976242ADAF028F67A39593B9B2D74D60A
        run: |
          export GNUPGHOME="$RUNNER_TEMP/veskri-gnupg"
          install -d -m 700 "$GNUPGHOME"
          if [ -z "$LINUX_GPG_PRIVATE_KEY" ]; then
            echo "Missing required LINUX_GPG_PRIVATE_KEY repository secret."
            exit 1
          fi
          printf '%s' "$LINUX_GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --batch --list-secret-keys --with-colons "$LINUX_GPG_FINGERPRINT" | grep -q '^sec:'
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
      - name: Sign and upload Linux release artifacts
        if: runner.os == 'Linux'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LINUX_GPG_PASSPHRASE: ${{ secrets.LINUX_GPG_PASSPHRASE }}
          LINUX_GPG_FINGERPRINT: BE00817976242ADAF028F67A39593B9B2D74D60A
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          trap 'gpgconf --kill gpg-agent || true; rm -rf "$GNUPGHOME"' EXIT
          mapfile -d '' artifacts < <(find src-tauri/target/release/bundle -type f \( -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \) -print0)
          if [ "${#artifacts[@]}" -eq 0 ]; then
            echo "No Linux release artifacts were found."
            exit 1
          fi
          for artifact in "${artifacts[@]}"; do
            gpg --batch --yes --pinentry-mode loopback \
              --passphrase "$LINUX_GPG_PASSPHRASE" \
              --local-user "$LINUX_GPG_FINGERPRINT" \
              --armor --detach-sign \
              --output "${artifact}.asc" \
              "$artifact"
          done
          signatures=("${artifacts[@]/%/.asc}")
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --clobber "${signatures[@]}"

  publish-release:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Publish the completed release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          gh release edit "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false \
            --latest
