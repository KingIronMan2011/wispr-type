name: Release Veskri
run-name: Release ${{ inputs.release_tag || github.ref_name }} · ${{ github.actor }}

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing version tag to publish (for example, v0.1.0)"
        required: true
        type: string

permissions:
  artifact-metadata: write
  attestations: write
  contents: write
  id-token: write

concurrency:
  group: release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    steps:
      - name: Create the draft release once
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; uploading missing artifacts."
            exit 0
          fi

          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Veskri $RELEASE_TAG" \
            --generate-notes \
            --draft

  release-sbom:
    needs: prepare-release
    name: Release SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - name: Generate the SPDX software bill of materials
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: veskri.sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Upload SBOM to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          gh release upload "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber \
            veskri.sbom.spdx.json

  release:
    needs: prepare-release
    name: Release (${{ matrix.name }})
    strategy:
      fail-fast: false
      max-parallel: 9
      matrix:
        include:
          - name: Windows / Vulkan
            kind: standard
            runner: windows-latest
            cache_key: windows-x64
            build_script: build:ci:windows
            bundle_root: D:\v
          - name: Linux / Vulkan
            kind: standard
            runner: ubuntu-latest
            cache_key: linux-x64
            build_script: build:ci:linux
          - name: macOS Intel / Metal
            kind: standard
            runner: macos-26-intel
            cache_key: macos-intel-metal-v3
            build_script: build:ci:mac
          - name: macOS Apple Silicon / Metal
            kind: standard
            runner: macos-26
            cache_key: macos-arm64-metal-v3
            build_script: build:ci:mac
          - name: CUDA / Windows
            kind: gpu
            runner: windows-latest
            target: windows
            backend: cuda
            cache_key: windows-cuda-x64
            build_script: build:ci:windows-cuda
            bundle_root: D:\veskri-cuda-target
          - name: CUDA / Linux
            kind: gpu
            runner: ubuntu-latest
            target: linux
            backend: cuda
            cache_key: linux-cuda-x64
            build_script: build:ci:linux-cuda
          - name: ROCm / Linux
            kind: gpu
            runner: ubuntu-latest
            target: linux
            backend: rocm
            cache_key: linux-rocm-x64
            build_script: build:ci:linux-rocm
          - name: Intel SYCL / Windows
            kind: gpu
            runner: windows-latest
            target: windows
            backend: intel-sycl
            cache_key: windows-intel-sycl-x64
            build_script: build:ci:windows-intel
            bundle_root: D:\veskri-intel-sycl-target
          - name: Intel SYCL / Linux
            kind: gpu
            runner: ubuntu-latest
            target: linux
            backend: intel-sycl
            cache_key: linux-intel-sycl-x64
            build_script: build:ci:linux-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux system dependencies
        if: matrix.kind == 'standard' && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libclang-dev \
            file \
            gnupg \
            libasound2-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libvulkan-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            rpm \
            glslc
      - name: Install Vulkan SDK for Windows local Whisper acceleration
        if: matrix.kind == 'standard' && runner.os == 'Windows'
        shell: pwsh
        run: |
          winget install --id KhronosGroup.VulkanSDK --exact --silent --accept-package-agreements --accept-source-agreements --source winget
          winget install --id LLVM.LLVM --exact --silent --accept-package-agreements --accept-source-agreements --source winget
          $vulkanSdk = Get-ChildItem 'C:\VulkanSDK' -Directory | Sort-Object Name -Descending | Select-Object -First 1
          if (-not $vulkanSdk) { throw 'The Vulkan SDK installation was not found.' }
          echo "VULKAN_SDK=$($vulkanSdk.FullName)" >> "$env:GITHUB_ENV"
          echo "$($vulkanSdk.FullName)\Bin" >> "$env:GITHUB_PATH"
          echo "LIBCLANG_PATH=C:\\Program Files\\LLVM\\bin" >> "$env:GITHUB_ENV"
      - name: Use a short Windows build path for Vulkan shader generation
        if: matrix.kind == 'standard' && runner.os == 'Windows'
        shell: pwsh
        run: |
          # whisper.cpp creates deeply nested shader-generator projects. Keep the
          # Cargo target path short so MSBuild's FileTracker stays below MAX_PATH.
          'CARGO_TARGET_DIR=D:\v' >> $env:GITHUB_ENV

      - name: Configure Windows C/C++ headers for Local Whisper bindgen
        if: matrix.kind == 'standard' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $clang = 'C:\Program Files\LLVM\bin\clang.exe'
          $resource = & $clang -print-resource-dir
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $msvc = Get-ChildItem "$vs\VC\Tools\MSVC" -Directory | Sort-Object Name -Descending | Select-Object -First 1
          $sdk = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\Include' -Directory | Sort-Object Name -Descending | Select-Object -First 1
          if (-not $resource -or -not $msvc -or -not $sdk) { throw 'Required Windows C/C++ headers were not found.' }
          $includes = @(
            "-isystem `"$resource\include`"",
            "-isystem `"$($msvc.FullName)\include`"",
            "-isystem `"$($sdk.FullName)\ucrt`"",
            "-isystem `"$($sdk.FullName)\shared`"",
            "-isystem `"$($sdk.FullName)\um`""
          ) -join ' '
          "BINDGEN_EXTRA_CLANG_ARGS_x86_64_pc_windows_msvc=$includes" >> $env:GITHUB_ENV
      - name: Install macOS local Whisper build dependencies
        if: matrix.kind == 'standard' && runner.os == 'macOS'
        run: |
          brew install llvm
          {
            echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib"
            echo "MACOSX_DEPLOYMENT_TARGET=26.0"
            echo "CMAKE_OSX_DEPLOYMENT_TARGET=26.0"
            echo "CFLAGS=-mmacosx-version-min=26.0"
            echo "CXXFLAGS=-mmacosx-version-min=26.0"
          } >> "$GITHUB_ENV"
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
          key: ${{ matrix.cache_key }}
      - run: pnpm install --frozen-lockfile
      - name: Verify release metadata
        run: pnpm metadata:check
      - name: Verify updater signing secret
        if: matrix.kind == 'standard'
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw 'Missing required TAURI_SIGNING_PRIVATE_KEY repository secret.'
          }
      - if: matrix.kind == 'standard'
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          VESKRI_TAURI_BUILD_SCRIPT: ${{ matrix.build_script }}
        with:
          tagName: ${{ inputs.release_tag || github.ref_name }}
          releaseName: "Veskri ${{ inputs.release_tag || github.ref_name }}"
          releaseBody: "Windows and Linux Vulkan installers, plus unsigned macOS Metal builds for Apple Silicon and Intel. Native CUDA, ROCm, and Intel SYCL assets are separately named manual-update variants. All in-app updater packages are signed."
          releaseDraft: true
          prerelease: false
          generateReleaseNotes: false
          updaterJsonPreferNsis: true
          tauriScript: "pnpm exec tsx scripts/run-tauri-ci-build.ts"
      - name: Import Linux release signing key
        if: matrix.kind == 'standard' && runner.os == 'Linux'
        env:
          LINUX_GPG_PRIVATE_KEY: ${{ secrets.LINUX_GPG_PRIVATE_KEY }}
          LINUX_GPG_FINGERPRINT: BE00817976242ADAF028F67A39593B9B2D74D60A
        run: |
          export GNUPGHOME="$RUNNER_TEMP/veskri-gnupg"
          install -d -m 700 "$GNUPGHOME"
          if [ -z "$LINUX_GPG_PRIVATE_KEY" ]; then
            echo "Missing required LINUX_GPG_PRIVATE_KEY repository secret."
            exit 1
          fi
          printf '%s' "$LINUX_GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --batch --list-secret-keys --with-colons "$LINUX_GPG_FINGERPRINT" | grep -q '^sec:'
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
      - name: Sign and upload Linux release artifacts
        if: matrix.kind == 'standard' && runner.os == 'Linux'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LINUX_GPG_PASSPHRASE: ${{ secrets.LINUX_GPG_PASSPHRASE }}
          LINUX_GPG_FINGERPRINT: BE00817976242ADAF028F67A39593B9B2D74D60A
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          trap 'gpgconf --kill gpg-agent || true; rm -rf "$GNUPGHOME"' EXIT
          mapfile -d '' artifacts < <(find src-tauri/target/release/bundle -type f \( -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \) -print0)
          if [ "${#artifacts[@]}" -eq 0 ]; then
            echo "No Linux release artifacts were found."
            exit 1
          fi
          for artifact in "${artifacts[@]}"; do
            gpg --batch --yes --pinentry-mode loopback \
              --passphrase "$LINUX_GPG_PASSPHRASE" \
              --local-user "$LINUX_GPG_FINGERPRINT" \
              --armor --detach-sign \
              --output "${artifact}.asc" \
              "$artifact"
          done
          signatures=("${artifacts[@]/%/.asc}")
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --clobber "${signatures[@]}"

      - name: Install CUDA and Windows Local Whisper build dependencies
        if: matrix.backend == 'cuda' && matrix.target == 'windows'
        shell: pwsh
        run: |
          winget install --id Nvidia.CUDA --exact --silent --accept-package-agreements --accept-source-agreements --source winget
          winget install --id LLVM.LLVM --exact --silent --accept-package-agreements --accept-source-agreements --source winget
          $cuda = Get-ChildItem 'C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA' -Directory | Sort-Object Name -Descending | Select-Object -First 1
          if (-not $cuda) { throw 'The CUDA Toolkit installation was not found.' }
          & "$($cuda.FullName)\bin\nvcc.exe" -V
          "CUDA_PATH=$($cuda.FullName)" >> $env:GITHUB_ENV
          "CudaToolkitDir=$($cuda.FullName)\" >> $env:GITHUB_ENV
          "CUDAToolkit_ROOT=$($cuda.FullName)" >> $env:GITHUB_ENV
          "CUDACXX=$($cuda.FullName)\bin\nvcc.exe" >> $env:GITHUB_ENV
          "$($cuda.FullName)\bin" >> $env:GITHUB_PATH
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV
      - name: Use a short Windows build path for CUDA
        if: matrix.backend == 'cuda' && matrix.target == 'windows'
        shell: pwsh
        run: "'CARGO_TARGET_DIR=D:\\veskri-cuda-target' >> $env:GITHUB_ENV"
      - name: Configure Windows C/C++ headers for Local Whisper bindgen
        if: matrix.backend == 'cuda' && matrix.target == 'windows'
        shell: pwsh
        run: |
          $clang = 'C:\Program Files\LLVM\bin\clang.exe'
          $resource = & $clang -print-resource-dir
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $msvc = Get-ChildItem "$vs\VC\Tools\MSVC" -Directory | Sort-Object Name -Descending | Select-Object -First 1
          $sdk = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\Include' -Directory | Sort-Object Name -Descending | Select-Object -First 1
          if (-not $resource -or -not $msvc -or -not $sdk) { throw 'Required Windows C/C++ headers were not found.' }
          $includes = @(
            "-isystem `"$resource\include`"",
            "-isystem `"$($msvc.FullName)\include`"",
            "-isystem `"$($sdk.FullName)\ucrt`"",
            "-isystem `"$($sdk.FullName)\shared`"",
            "-isystem `"$($sdk.FullName)\um`""
          ) -join ' '
          "BINDGEN_EXTRA_CLANG_ARGS_x86_64_pc_windows_msvc=$includes" >> $env:GITHUB_ENV
      - name: Install CUDA and Linux Local Whisper build dependencies
        if: matrix.backend == 'cuda' && matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libclang-dev \
            file \
            gnupg \
            libasound2-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            nvidia-cuda-toolkit \
            patchelf \
            rpm
          nvcc -V
          cuda_root="$(dirname "$(dirname "$(readlink -f "$(command -v nvcc)")")")"
          echo "CUDA_PATH=$cuda_root" >> "$GITHUB_ENV"
      - name: Verify updater signing secret
        if: matrix.backend == 'cuda' && matrix.target == 'windows'
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw 'Missing required TAURI_SIGNING_PRIVATE_KEY repository secret.'
          }

      - name: Install Linux and ROCm Local Whisper build dependencies
        if: matrix.backend == 'rocm'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libclang-dev \
            file \
            gnupg \
            libasound2-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            rpm \
            wget
          wget -q https://repo.radeon.com/amdgpu-install/7.2.4/ubuntu/noble/amdgpu-install_7.2.4.70204-1_all.deb
          sudo apt-get install -y ./amdgpu-install_7.2.4.70204-1_all.deb
          sudo apt-get update
          sudo amdgpu-install --usecase=hiplibsdk,rocm --no-dkms
          /opt/rocm/bin/hipconfig --full
          echo "HIP_PATH=/opt/rocm" >> "$GITHUB_ENV"
          echo "/opt/rocm/bin" >> "$GITHUB_PATH"
      - name: Install Windows Intel oneAPI build dependencies
        if: matrix.backend == 'intel-sycl' && matrix.target == 'windows'
        shell: pwsh
        run: |
          winget install --id Intel.OneAPI.Toolkit --exact --silent --accept-package-agreements --accept-source-agreements --source winget
          winget install --id LLVM.LLVM --exact --silent --accept-package-agreements --accept-source-agreements --source winget
          $oneapi = 'C:\Program Files (x86)\Intel\oneAPI'
          $setvars = Join-Path $oneapi 'setvars.bat'
          if (-not (Test-Path -LiteralPath $setvars)) { throw 'The Intel oneAPI Toolkit installation was not found.' }
          "ONEAPI_SETVARS=$setvars" >> $env:GITHUB_ENV
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV

      - name: Configure Windows C/C++ headers for Local Whisper bindgen
        if: matrix.backend == 'intel-sycl' && matrix.target == 'windows'
        shell: pwsh
        run: |
          $clang = 'C:\Program Files\LLVM\bin\clang.exe'
          $resource = & $clang -print-resource-dir
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $msvc = Get-ChildItem "$vs\VC\Tools\MSVC" -Directory | Sort-Object Name -Descending | Select-Object -First 1
          $sdk = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\Include' -Directory | Sort-Object Name -Descending | Select-Object -First 1
          if (-not $resource -or -not $msvc -or -not $sdk) { throw 'Required Windows C/C++ headers were not found.' }
          $includes = @(
            "-isystem `"$resource\include`"",
            "-isystem `"$($msvc.FullName)\include`"",
            "-isystem `"$($sdk.FullName)\ucrt`"",
            "-isystem `"$($sdk.FullName)\shared`"",
            "-isystem `"$($sdk.FullName)\um`""
          ) -join ' '
          "BINDGEN_EXTRA_CLANG_ARGS_x86_64_pc_windows_msvc=$includes" >> $env:GITHUB_ENV

      - name: Install Linux Intel oneAPI build dependencies
        if: matrix.backend == 'intel-sycl' && matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            file \
            gnupg \
            libasound2-dev \
            libappindicator3-dev \
            libclang-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            rpm \
            wget
          wget -qO- https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB \
            | gpg --dearmor | sudo tee /usr/share/keyrings/oneapi-archive-keyring.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/oneapi-archive-keyring.gpg] https://apt.repos.intel.com/oneapi all main" \
            | sudo tee /etc/apt/sources.list.d/oneAPI.list
          sudo apt-get update
          sudo apt-get install -y \
            intel-oneapi-compiler-dpcpp-cpp-and-cpp-classic \
            intel-oneapi-dpcpp-ct \
            intel-oneapi-dnnl-devel \
            intel-oneapi-mkl-devel
      - name: Build the Windows GPU installer
        if: matrix.kind == 'gpu' && matrix.target == 'windows'
        shell: pwsh
        env:
          BUILD_SCRIPT: ${{ matrix.build_script }}
          GPU_BACKEND: ${{ matrix.backend }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw 'Missing required TAURI_SIGNING_PRIVATE_KEY repository secret.'
          }
          if ($env:GPU_BACKEND -eq 'intel-sycl') {
            $environment = cmd /c ('call "{0}" intel64 >nul && set' -f $env:ONEAPI_SETVARS)
            foreach ($entry in $environment) {
              if ($entry -match '^([^=]+)=(.*)$') {
                [Environment]::SetEnvironmentVariable($Matches[1], $Matches[2], 'Process')
              }
            }
            $env:CMAKE_GENERATOR = 'Ninja'
            $env:CC = (Get-Command icx.exe -ErrorAction Stop).Source
            $env:CXX = (Get-Command icpx.exe -ErrorAction Stop).Source
            Get-Command ninja.exe -ErrorAction Stop | Out-Null
            $env:CARGO_TARGET_DIR = 'D:\veskri-intel-sycl-target'
          }
          pnpm run $env:BUILD_SCRIPT
      - name: Build the Linux GPU packages
        if: matrix.kind == 'gpu' && matrix.target == 'linux'
        env:
          BUILD_SCRIPT: ${{ matrix.build_script }}
          GPU_BACKEND: ${{ matrix.backend }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || {
            echo "Missing required TAURI_SIGNING_PRIVATE_KEY repository secret."
            exit 1
          }
          if [ "$GPU_BACKEND" = "intel-sycl" ]; then
            source /opt/intel/oneapi/setvars.sh --force > /dev/null
            syclcompat_header="$(find /opt/intel/oneapi -path '*/include/syclcompat/math.hpp' -print -quit)"
            test -n "$syclcompat_header" || {
              echo "The Intel oneAPI SYCLcompat headers were not found."
              exit 1
            }
            syclcompat_include="$(dirname "$(dirname "$syclcompat_header")")"
            export CPLUS_INCLUDE_PATH="$syclcompat_include${CPLUS_INCLUDE_PATH:+:$CPLUS_INCLUDE_PATH}"
          fi
          pnpm run "$BUILD_SCRIPT"
      - name: Upload the CUDA installer as a manual-update release asset
        if: matrix.backend == 'cuda' && matrix.target == 'windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          $installers = @(Get-ChildItem "$env:CARGO_TARGET_DIR\release\bundle\nsis" -Filter '*-setup.exe')
          if ($installers.Count -ne 1) { throw 'Expected exactly one CUDA NSIS installer.' }
          $installer = $installers[0]
          $cudaName = $installer.Name -replace '-setup\.exe$', '-cuda-setup.exe'
          $cudaInstaller = Join-Path $installer.DirectoryName $cudaName
          Copy-Item -LiteralPath $installer.FullName -Destination $cudaInstaller
          $signature = "$($installer.FullName).sig"
          $cudaSignature = "$cudaInstaller.sig"
          if (Test-Path -LiteralPath $signature) { Copy-Item -LiteralPath $signature -Destination $cudaSignature }
          $assets = @($cudaInstaller)
          if (Test-Path -LiteralPath $cudaSignature) { $assets += $cudaSignature }
          gh release upload "$env:RELEASE_TAG" --repo "$env:GITHUB_REPOSITORY" --clobber $assets
      - name: Verify updater signing secret
        if: matrix.backend == 'cuda' && matrix.target == 'linux'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || {
            echo "Missing required TAURI_SIGNING_PRIVATE_KEY repository secret."
            exit 1
          }

      - name: Import Linux release signing key
        if: matrix.backend == 'cuda' && matrix.target == 'linux'
        env:
          LINUX_GPG_PRIVATE_KEY: ${{ secrets.LINUX_GPG_PRIVATE_KEY }}
          LINUX_GPG_FINGERPRINT: BE00817976242ADAF028F67A39593B9B2D74D60A
        run: |
          export GNUPGHOME="$RUNNER_TEMP/veskri-cuda-gnupg"
          install -d -m 700 "$GNUPGHOME"
          test -n "$LINUX_GPG_PRIVATE_KEY" || {
            echo "Missing required LINUX_GPG_PRIVATE_KEY repository secret."
            exit 1
          }
          printf '%s' "$LINUX_GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --batch --list-secret-keys --with-colons "$LINUX_GPG_FINGERPRINT" | grep -q '^sec:'
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
      - name: Sign and upload CUDA Linux release artifacts
        if: matrix.backend == 'cuda' && matrix.target == 'linux'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LINUX_GPG_PASSPHRASE: ${{ secrets.LINUX_GPG_PASSPHRASE }}
          LINUX_GPG_FINGERPRINT: BE00817976242ADAF028F67A39593B9B2D74D60A
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          trap 'gpgconf --kill gpg-agent || true; rm -rf "$GNUPGHOME"' EXIT
          mapfile -d '' artifacts < <(find src-tauri/target/release/bundle -type f \( -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \) -print0)
          if [ "${#artifacts[@]}" -eq 0 ]; then
            echo "No CUDA Linux release artifacts were found."
            exit 1
          fi
          uploads=()
          for artifact in "${artifacts[@]}"; do
            variant="${artifact%.*}-cuda.${artifact##*.}"
            cp "$artifact" "$variant"
            gpg --batch --yes --pinentry-mode loopback \
              --passphrase "$LINUX_GPG_PASSPHRASE" \
              --local-user "$LINUX_GPG_FINGERPRINT" \
              --armor --detach-sign \
              --output "${variant}.asc" \
              "$variant"
            uploads+=("$variant" "${variant}.asc")
          done
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --clobber "${uploads[@]}"

      - name: Verify updater signing secret
        if: matrix.backend == 'rocm'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || {
            echo "Missing required TAURI_SIGNING_PRIVATE_KEY repository secret."
            exit 1
          }

      - name: Import Linux release signing key
        if: matrix.backend == 'rocm'
        env:
          LINUX_GPG_PRIVATE_KEY: ${{ secrets.LINUX_GPG_PRIVATE_KEY }}
          LINUX_GPG_FINGERPRINT: BE00817976242ADAF028F67A39593B9B2D74D60A
        run: |
          export GNUPGHOME="$RUNNER_TEMP/veskri-rocm-gnupg"
          install -d -m 700 "$GNUPGHOME"
          test -n "$LINUX_GPG_PRIVATE_KEY" || {
            echo "Missing required LINUX_GPG_PRIVATE_KEY repository secret."
            exit 1
          }
          printf '%s' "$LINUX_GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --batch --list-secret-keys --with-colons "$LINUX_GPG_FINGERPRINT" | grep -q '^sec:'
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
      - name: Sign and upload ROCm release artifacts
        if: matrix.backend == 'rocm'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LINUX_GPG_PASSPHRASE: ${{ secrets.LINUX_GPG_PASSPHRASE }}
          LINUX_GPG_FINGERPRINT: BE00817976242ADAF028F67A39593B9B2D74D60A
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          trap 'gpgconf --kill gpg-agent || true; rm -rf "$GNUPGHOME"' EXIT
          mapfile -d '' artifacts < <(find src-tauri/target/release/bundle -type f \( -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \) -print0)
          if [ "${#artifacts[@]}" -eq 0 ]; then
            echo "No ROCm release artifacts were found."
            exit 1
          fi
          uploads=()
          for artifact in "${artifacts[@]}"; do
            variant="${artifact%.*}-rocm.${artifact##*.}"
            cp "$artifact" "$variant"
            gpg --batch --yes --pinentry-mode loopback \
              --passphrase "$LINUX_GPG_PASSPHRASE" \
              --local-user "$LINUX_GPG_FINGERPRINT" \
              --armor --detach-sign \
              --output "${variant}.asc" \
              "$variant"
            uploads+=("$variant" "${variant}.asc")
          done
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --clobber "${uploads[@]}"

      - name: Verify updater signing secret
        if: matrix.backend == 'intel-sycl' && matrix.target == 'windows'
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw 'Missing required TAURI_SIGNING_PRIVATE_KEY repository secret.'
          }

      - name: Upload the Intel SYCL Windows installer as a manual-update release asset
        if: matrix.backend == 'intel-sycl' && matrix.target == 'windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          $installers = @(Get-ChildItem 'D:\veskri-intel-sycl-target\release\bundle\nsis' -Filter '*-setup.exe')
          if ($installers.Count -ne 1) { throw 'Expected exactly one Intel SYCL NSIS installer.' }
          $installer = $installers[0]
          $intelName = $installer.Name -replace '-setup\.exe$', '-intel-sycl-setup.exe'
          $intelInstaller = Join-Path $installer.DirectoryName $intelName
          Copy-Item -LiteralPath $installer.FullName -Destination $intelInstaller
          $signature = "$($installer.FullName).sig"
          $intelSignature = "$intelInstaller.sig"
          if (Test-Path -LiteralPath $signature) { Copy-Item -LiteralPath $signature -Destination $intelSignature }
          $assets = @($intelInstaller)
          if (Test-Path -LiteralPath $intelSignature) { $assets += $intelSignature }
          gh release upload "$env:RELEASE_TAG" --repo "$env:GITHUB_REPOSITORY" --clobber $assets
      - name: Verify updater signing secret
        if: matrix.backend == 'intel-sycl' && matrix.target == 'linux'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || {
            echo "Missing required TAURI_SIGNING_PRIVATE_KEY repository secret."
            exit 1
          }

      - name: Import Linux release signing key
        if: matrix.backend == 'intel-sycl' && matrix.target == 'linux'
        env:
          LINUX_GPG_PRIVATE_KEY: ${{ secrets.LINUX_GPG_PRIVATE_KEY }}
          LINUX_GPG_FINGERPRINT: BE00817976242ADAF028F67A39593B9B2D74D60A
        run: |
          export GNUPGHOME="$RUNNER_TEMP/veskri-intel-sycl-gnupg"
          install -d -m 700 "$GNUPGHOME"
          test -n "$LINUX_GPG_PRIVATE_KEY" || {
            echo "Missing required LINUX_GPG_PRIVATE_KEY repository secret."
            exit 1
          }
          printf '%s' "$LINUX_GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --batch --list-secret-keys --with-colons "$LINUX_GPG_FINGERPRINT" | grep -q '^sec:'
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
      - name: Sign and upload Intel SYCL Linux release artifacts
        if: matrix.backend == 'intel-sycl' && matrix.target == 'linux'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LINUX_GPG_PASSPHRASE: ${{ secrets.LINUX_GPG_PASSPHRASE }}
          LINUX_GPG_FINGERPRINT: BE00817976242ADAF028F67A39593B9B2D74D60A
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          trap 'gpgconf --kill gpg-agent || true; rm -rf "$GNUPGHOME"' EXIT
          mapfile -d '' artifacts < <(find src-tauri/target/release/bundle -type f \( -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \) -print0)
          if [ "${#artifacts[@]}" -eq 0 ]; then
            echo "No Intel SYCL Linux release artifacts were found."
            exit 1
          fi
          uploads=()
          for artifact in "${artifacts[@]}"; do
            variant="${artifact%.*}-intel-sycl.${artifact##*.}"
            cp "$artifact" "$variant"
            gpg --batch --yes --pinentry-mode loopback \
              --passphrase "$LINUX_GPG_PASSPHRASE" \
              --local-user "$LINUX_GPG_FINGERPRINT" \
              --armor --detach-sign \
              --output "${variant}.asc" \
              "$variant"
            uploads+=("$variant" "${variant}.asc")
          done
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --clobber "${uploads[@]}"

      - name: Collect Windows release artifacts for provenance
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          BUNDLE_ROOT: ${{ matrix.bundle_root }}
          MATRIX_BACKEND: ${{ matrix.backend }}
          MATRIX_KIND: ${{ matrix.kind }}
        run: |
          $source = Join-Path $env:BUNDLE_ROOT 'release\bundle'
          $destination = Join-Path $env:GITHUB_WORKSPACE 'release-subjects'
          New-Item -ItemType Directory -Force -Path $destination | Out-Null
          if ($env:MATRIX_KIND -eq 'gpu') {
            $artifacts = @(Get-ChildItem $source -Recurse -File -Filter "*-$env:MATRIX_BACKEND-setup.exe")
          } else {
            $artifacts = @(Get-ChildItem $source -Recurse -File | Where-Object {
              $_.Extension -in @('.exe', '.msi')
            })
          }
          if ($artifacts.Count -eq 0) { throw 'No Windows release artifacts were found for provenance.' }
          $artifacts | ForEach-Object {
            Copy-Item -LiteralPath $_.FullName -Destination $destination
          }
      - name: Collect Linux and macOS release artifacts for provenance
        if: runner.os != 'Windows'
        env:
          MATRIX_BACKEND: ${{ matrix.backend }}
          MATRIX_KIND: ${{ matrix.kind }}
        run: |
          mkdir -p release-subjects
          if [ "$MATRIX_KIND" = "gpu" ]; then
            find src-tauri/target/release/bundle -type f \
              -name "*-$MATRIX_BACKEND.*" \
              ! -name '*.asc' \
              ! -name '*.sig' \
              -exec cp {} release-subjects/ \;
          else
            find src-tauri/target/release/bundle -type f \
              ! -name '*.asc' \
              ! -name '*.sig' \
              -exec cp {} release-subjects/ \;
          fi
          test "$(find release-subjects -maxdepth 1 -type f | wc -l)" -gt 0 || {
            echo "No release artifacts were found for provenance."
            exit 1
          }
      - name: Generate build provenance attestation
        uses: actions/attest@v4
        with:
          subject-path: release-subjects/**

  publish-release:
    needs: [release, release-sbom]
    runs-on: ubuntu-latest
    steps:
      - name: Publish the completed release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          gh release edit "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false \
            --latest
